# Builds the custom GitHub Desktop fork on Windows and publishes a GitHub
# Release with the generated Setup .exe as a download asset.
#
# The build is intentionally UNSIGNED: upstream code-signing is gated behind
# isPublishable() in script/package.ts, which is false on the custom branch,
# so no certificates are required.
#
# Triggers:
#   * workflow_dispatch  -> manual first run / patch build
#   * workflow_run        -> automatically after a successful "Upstream Sync"
name: Build and Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Upstream Sync"]
    types:
      - completed
    branches:
      - custom

permissions:
  contents: write

env:
  NODE_VERSION: '24.15.0'

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2022

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: custom
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply custom branding
        shell: bash
        run: |
          # Pin the "Modified by KingchenC" menu-bar label into every released
          # build, independent of whether the source-level branding commit
          # survives an upstream rebase. Idempotent: if the label is already
          # present nothing is inserted. The trailing grep fails the build
          # loudly if the anchor ever disappears instead of shipping unbranded.
          f=app/src/main-process/menu/build-default-menu.ts
          if ! grep -q 'Modified by KingchenC' "$f"; then
            perl -0pi -e 's/(\n\s*ensureItemIds\(template\))/\n  template.push({ label: "Modified by KingchenC", enabled: false })$1/' "$f"
          fi
          grep -q 'Modified by KingchenC' "$f"
          echo "Custom menu branding applied."

      - name: Compute release tag
        shell: bash
        run: echo "TAG=custom-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build (production)
        run: yarn build:prod
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          # Embed the release tag so the custom updater knows this build's version
          CUSTOM_UPDATE_TAG: ${{ env.TAG }}

      - name: Package (Windows installer)
        run: yarn package

      - name: Locate installer
        id: artifact
        shell: pwsh
        run: |
          # yarn package writes the Squirrel installers to dist/
          $candidates = Get-ChildItem -Path dist -Recurse -Filter *.exe -ErrorAction SilentlyContinue
          # Prefer the standalone Setup installer; never the bundled helper exes
          $exe = $candidates | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          if (-not $exe) {
            $exe = $candidates | Where-Object { $_.Name -like 'GitHubDesktop*' } | Select-Object -First 1
          }
          if (-not $exe) {
            $exe = $candidates | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Host "No installer .exe under dist/. Contents:"
            Get-ChildItem -Path dist -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
            Write-Error "No installer .exe produced under dist/"
            exit 1
          }
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer: $($exe.FullName)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: GitHub Desktop Custom Build ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
