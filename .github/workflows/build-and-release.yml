# Builds the custom GitHub Desktop fork on Windows and publishes a GitHub
# Release with the generated Setup .exe as a download asset.
#
# The build is intentionally UNSIGNED: upstream code-signing is gated behind
# isPublishable() in script/package.ts, which is false on the custom branch,
# so no certificates are required.
#
# Triggers:
#   * workflow_dispatch  -> manual first run / patch build
#   * workflow_run        -> automatically after a successful "Upstream Sync"
name: Build and Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Upstream Sync"]
    types:
      - completed
    branches:
      - custom

permissions:
  contents: write

env:
  NODE_VERSION: '24.15.0'

jobs:
  # Gate: only build/release when the custom branch actually advanced since the
  # last release. The daily Upstream Sync completes successfully even when there
  # were no upstream commits, which would otherwise trigger a byte-identical
  # rebuild and a phantom "update available" prompt every day. Comparing the
  # current custom HEAD against the commit the latest release points at skips
  # those no-op runs.
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: custom
          fetch-depth: 0

      - name: Decide whether anything changed since the last release
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          latest_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"

          if [ -z "$latest_tag" ]; then
            echo "No previous release found - building."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the commit the latest release tag points at. action-gh-release
          # creates a lightweight tag, so the ref object is the commit directly;
          # dereference defensively in case it is ever an annotated tag object.
          ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$latest_tag" -q '.object.sha' 2>/dev/null || true)"
          ref_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$latest_tag" -q '.object.type' 2>/dev/null || true)"
          if [ "$ref_type" = "tag" ]; then
            ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" -q '.object.sha' 2>/dev/null || true)"
          fi

          echo "custom HEAD          : $head_sha"
          echo "release $latest_tag : $ref_sha"

          if [ -n "$ref_sha" ] && [ "$head_sha" = "$ref_sha" ]; then
            echo "Custom branch unchanged since $latest_tag - skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: windows-2022

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: custom
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply custom branding
        shell: bash
        run: |
          # Pin the "Modified by KingchenC" menu-bar entry into every released
          # build, independent of whether the source-level branding commit
          # survives an upstream rebase. It must be a submenu: the custom Windows
          # menu bar only renders top-level items of type 'submenuItem'.
          # Idempotent: if the entry is already present nothing is inserted. The
          # trailing grep fails the build loudly if the anchor ever disappears
          # instead of shipping unbranded.
          f=app/src/main-process/menu/build-default-menu.ts
          if ! grep -q 'Modified by KingchenC' "$f"; then
            perl -0pi -e 's#(\n\s*ensureItemIds\(template\))#\n  template.push({ label: "Modified by KingchenC | v-" + (__CUSTOM_UPDATE_TAG__.split("-").pop() || "dev"), submenu: [{ label: "Custom fork - github.com/kingchenc/desktop", click() { shell.openExternal("https://github.com/kingchenc/desktop").catch(err => log.error("Failed opening fork page", err)) } }] })$1#' "$f"
          fi
          grep -q 'Modified by KingchenC' "$f"
          echo "Custom menu branding applied."

      - name: Compute release tag
        shell: bash
        run: echo "TAG=custom-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build (production)
        run: yarn build:prod
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          # Embed the release tag so the custom updater knows this build's version
          CUSTOM_UPDATE_TAG: ${{ env.TAG }}

      - name: Package (Windows installer)
        run: yarn package

      - name: Locate installer
        id: artifact
        shell: pwsh
        run: |
          # yarn package writes the Squirrel installers to dist/
          $candidates = Get-ChildItem -Path dist -Recurse -Filter *.exe -ErrorAction SilentlyContinue
          # Prefer the standalone Setup installer; never the bundled helper exes
          $exe = $candidates | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          if (-not $exe) {
            $exe = $candidates | Where-Object { $_.Name -like 'GitHubDesktop*' } | Select-Object -First 1
          }
          if (-not $exe) {
            $exe = $candidates | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Host "No installer .exe under dist/. Contents:"
            Get-ChildItem -Path dist -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
            Write-Error "No installer .exe produced under dist/"
            exit 1
          }
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer: $($exe.FullName)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: GitHub Desktop Custom Build ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
